<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChamoMarket</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ═══ LOGIN ═══ -->
<div id="screen-login" class="login-screen d-flex align-items-center justify-content-center">
  <div class="card login-card shadow-lg">
    <div class="card-body p-5">
      <div class="text-center mb-4">
        <div class="login-logo mb-3">
          <i class="bi bi-shop-window"></i>
        </div>
        <h3 class="fw-bold">ChamoMarket</h3>
        <p class="text-muted small">Sistema de Ventas</p>
      </div>
      <div id="login-error" class="alert alert-danger d-none small py-2"></div>
      <form id="form-login">
        <div class="mb-3">
          <label class="form-label fw-semibold">Usuario</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-person"></i></span>
            <input type="text" id="login-username" class="form-control" placeholder="Ingresa tu usuario" required autofocus>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input type="password" id="login-password" class="form-control" placeholder="Ingresa tu contraseña" required>
          </div>
        </div>
        <button type="submit" id="btn-login" class="btn btn-primary w-100 py-2 fw-semibold">
          <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión
        </button>
      </form>
    </div>
  </div>
</div>

<!-- ═══ APP ═══ -->
<div id="screen-app" class="app-screen d-none">

  <!-- Sidebar -->
  <nav id="sidebar">
    <div class="sidebar-header">
      <i class="bi bi-shop-window me-2 text-primary"></i>
      <span class="fw-bold fs-5">ChamoMarket</span>
    </div>

    <div class="sidebar-section-label">MÓDULOS</div>
    <ul class="sidebar-nav">
      <li>
        <a href="#" class="sidebar-link" data-view="products">
          <i class="bi bi-box-seam"></i><span>Productos</span>
        </a>
      </li>
      <li class="admin-only">
        <a href="#" class="sidebar-link" data-view="categories">
          <i class="bi bi-tags"></i><span>Categorías</span>
        </a>
      </li>
      <li>
        <a href="#" class="sidebar-link" data-view="sales">
          <i class="bi bi-cart-check"></i><span>Ventas</span>
        </a>
      </li>
      <li class="admin-only">
        <a href="#" class="sidebar-link" data-view="employees">
          <i class="bi bi-people"></i><span>Empleados</span>
        </a>
      </li>
      <li class="admin-only">
        <a href="#" class="sidebar-link" data-view="suppliers">
          <i class="bi bi-truck"></i><span>Proveedores</span>
        </a>
      </li>
    </ul>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="user-avatar">
          <i class="bi bi-person-circle"></i>
        </div>
        <div class="user-info">
          <div id="sidebar-username" class="fw-semibold small"></div>
          <div id="sidebar-role" class="text-muted" style="font-size:0.72rem"></div>
        </div>
      </div>
      <button id="btn-logout" class="btn btn-sm btn-outline-light w-100 mt-2" title="Cerrar sesión">
        <i class="bi bi-box-arrow-right me-1"></i>Salir
      </button>
    </div>
  </nav>

  <!-- Main -->
  <main id="main-content">
    <div id="view-products"  class="view d-none"></div>
    <div id="view-categories" class="view d-none"></div>
    <div id="view-sales"     class="view d-none"></div>
    <div id="view-employees" class="view d-none"></div>
    <div id="view-suppliers" class="view d-none"></div>
  </main>

</div>

<!-- ═══ MODAL ═══ -->
<div class="modal fade" id="modal-main" tabindex="-1" data-bs-backdrop="static">
  <div class="modal-dialog modal-dialog-centered" id="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-title"></h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="modal-body"></div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="modal-confirm">
          <span id="modal-confirm-text">Guardar</span>
        </button>
      </div>
    </div>
  </div>
</div>

<!-- ═══ TOAST ═══ -->
<div class="position-fixed top-0 end-0 p-3" style="z-index:9999">
  <div id="toast-el" class="toast align-items-center text-white border-0" role="alert" aria-live="assertive">
    <div class="d-flex">
      <div class="toast-body fw-semibold" id="toast-body"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
